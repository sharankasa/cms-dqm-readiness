# the pilot-the readiness inputs on EKS: one Indexed Job per side (sliced or reference). Each pod = one shard; it reads its
# input from S3 and keeps its result file in S3, so a replacement pod (after a pod or node is killed)
# resumes and every (measure, stay) is written exactly once. Credentials: EKS Pod Identity through the
# service account dqm-worker (infra/eks/main.tf), S3 only, run prefixes only.
# Placeholders filled by run_eks_job.sh: __NAME__ __MODE__ __SHARDS__ __PARALLEL__ __IMAGE__ __INPUT__
# __ENGINE__ __OUT__ __HEAP__ __CPU__ __MEMREQ__ __MEMLIM__ __ENGINEOUT__ __VOUT__ __NOPOP__ __LABEL__ (compare-v)
# __SHARDOFFSET__ (shard = completion index + offset) __RESULTSFROM__ __PROFTARGET__ __PROFSECONDS__ (profile)
# __BATCH__ __BATCHMAXRES__ (sliced: stays per engine call) __ENGINEPREFIX__ (compare-v)
# __NODESEL__ (empty, or "eks.amazonaws.com/nodegroup: <group>" to keep the pods on one node group)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dqm-worker
  namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: default
  labels: {app: dqm-worker}
spec:
  completionMode: Indexed
  completions: __SHARDS__
  parallelism: __PARALLEL__
  backoffLimitPerIndex: 3
  maxFailedIndexes: 0
  # evictions (node disk or memory pressure) and node loss are not the work's fault: retry without
  # counting them against the per-index limit (2026-10-12: disk-pressure evictions counted as failures)
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    metadata:
      labels: {app: dqm-worker, job: __NAME__}
    spec:
      serviceAccountName: dqm-worker
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      nodeSelector: {__NODESEL__}
      containers:
        - name: worker
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD
              valueFrom:
                fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
            - {name: SHARD_OFFSET, value: "__SHARDOFFSET__"}
            - {name: RESULTS_FROM, value: "__RESULTSFROM__"}
            - {name: PROFILE_TARGET_S, value: "__PROFTARGET__"}
            - {name: PROFILE_SECONDS, value: "__PROFSECONDS__"}
            - {name: MODE, value: "__MODE__"}
            - {name: INPUT, value: "__INPUT__"}
            - {name: ENGINE, value: "__ENGINE__"}
            - {name: OUT, value: "__OUT__"}
            - {name: HEAP_MB, value: "__HEAP__"}
            - {name: AWS_REGION, value: "us-west-2"}
            - {name: ENGINE_OUT, value: "__ENGINEOUT__"}
            - {name: V_OUT, value: "__VOUT__"}
            - {name: NO_POP_COUNTS, value: "__NOPOP__"}
            - {name: LABEL, value: "__LABEL__"}
            - {name: BATCH, value: "__BATCH__"}
            - {name: BATCH_MAX_RES, value: "__BATCHMAXRES__"}
            - {name: ENGINE_PREFIX, value: "__ENGINEPREFIX__"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: "__CPU__", memory: "__MEMREQ__"}
            limits: {memory: "__MEMLIM__"}
          volumeMounts:
            - {name: work, mountPath: /work}
      volumes:
        - name: work
          emptyDir: {}
